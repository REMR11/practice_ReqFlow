[project]
name = "reqflow"
version = "0.1.0"
description = "Pipeline PO -> QA -> Arquitectura: de un requerimiento a tres artefactos Markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
